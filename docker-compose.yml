version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: watchkeeper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: watchkeeper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize database with schema
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - watchkeeper_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

          
  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: watchkeeper-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - watchkeeper_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Elasticsearch for advanced search
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: watchkeeper-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - watchkeeper_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # WATCHKEEPER API Server
  api:
    build: .
    container_name: watchkeeper-api
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres/watchkeeper
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - SECRET_KEY=${SECRET_KEY:-your_secret_key_here_change_in_production}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_DEBUG=true
      - LOG_LEVEL=INFO
    command: python run.py
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - watchkeeper_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # Celery Worker for background tasks
  celery_worker:
    build: .
    container_name: watchkeeper-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --queues=alerts,intelligence,monitoring,notifications
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres/watchkeeper
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    restart: unless-stopped
    networks:
      - watchkeeper_network
    depends_on:
      - postgres
      - redis
      - api

  # Celery Beat for scheduled tasks
  celery_beat:
    build: .
    container_name: watchkeeper-celery-beat
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
      - ./.env:/app/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://postgres:postgres@postgres/watchkeeper
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    networks:
      - watchkeeper_network
    depends_on:
      - postgres
      - redis
      - celery_worker

  # PGAdmin (optional - uncomment if needed)
  # pgadmin:
  #   image: dpage/pgadmin4:7.7
  #   container_name: watchkeeper-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@watchkeeper.org
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin_data:/var/lib/pgadmin
  #   depends_on:
  #     - postgres
  #   # Resource limits for Mac mini
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: '0.5'
  #         memory: 256M

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  # pgadmin_data:

networks:
  watchkeeper_network:
    driver: bridge
