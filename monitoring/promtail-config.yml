server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # WATCHKEEPER API logs
  - job_name: watchkeeper_api
    static_configs:
      - targets:
          - localhost
        labels:
          job: watchkeeper_api
          __path__: /app/logs/api/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            user_id: user_id
            endpoint: endpoint
            method: method
            status_code: status_code
      - labels:
          level:
          endpoint:
          method:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Celery worker logs
  - job_name: celery_workers
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery_workers
          __path__: /app/logs/celery/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            task: task
            worker: worker
      - labels:
          level:
          task:
      - timestamp:
          source: timestamp
          format: RFC3339

  # Intelligence collection logs
  - job_name: intelligence_collection
    static_configs:
      - targets:
          - localhost
        labels:
          job: intelligence_collection
          __path__: /app/logs/intelligence/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            source: source
            items_collected: items_collected
      - labels:
          level:
          source:
      - timestamp:
          source: timestamp
          format: RFC3339

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+):\s+(?P<message>.*)$'
      - labels:
          hostname:
          service:
      - timestamp:
          source: timestamp
          format: Jan _2 15:04:05
